services:
  # Unified Full-Stack Web Service (FastAPI + React SPA)
  - type: web
    name: arogya-setu-fullstack
    runtime: python
    buildCommand: bash build.sh
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false


